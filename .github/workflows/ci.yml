name: CI
on:
  push:
    branches: [ develop ]

jobs:
  push_to_gitlab:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          
      - name: Push code to develop Gitlab
        env:
          GITLAB_ACCESS_TOKEN: ${{ secrets.GITLAB_ACCESS_TOKEN }}
          GITLAB_REPOSITORY_URL: ${{ secrets.GITLAB_REPOSITORY_URL }}
        run: |
          echo "Starting to push repo to gitlab"
          git remote add gitlab "https://oauth2:${GITLAB_ACCESS_TOKEN}@${GITLAB_REPOSITORY_URL}"
          git push gitlab develop -f

  build_docker_image:
    runs-on: ubuntu-latest
    needs: push_to_gitlab
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Build Docker image
        env:
          IMAGE_NAME: softbank-mentari
          IMAGE_TAG: ${{ github.sha }}
        run: |
          echo "Building Docker image..."
          docker build -t $IMAGE_NAME:$IMAGE_TAG .
          docker tag $IMAGE_NAME:$IMAGE_TAG $IMAGE_NAME:latest
          
      - name: Save Docker image to file
        run: |
          docker save softbank-mentari:${{ github.sha }} > image.tar
          docker save softbank-mentari:latest > image-latest.tar
          
      - name: Upload image artifact
        uses: actions/download-artifact@v4
        with:
          name: docker-image
          path: |
            image.tar
            image-latest.tar
          retention-days: 1

  push_to_acr:
    runs-on: ubuntu-latest
    needs: build_docker_image
    steps:
      - name: Download image artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          
      - name: Load Docker images
        run: |
          docker load < image.tar
          docker load < image-latest.tar
          
      - name: Login to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_REGISTRY_NAME }}.azurecr.io
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}
          
      - name: Tag and push to ACR
        env:
          ACR_REGISTRY: ${{ secrets.ACR_REGISTRY_NAME }}.azurecr.io
          IMAGE_NAME: softbank-mentari
        run: |
          # Tag với ACR registry
          docker tag softbank-mentari:${{ github.sha }} $ACR_REGISTRY/$IMAGE_NAME:${{ github.sha }}
          docker tag softbank-mentari:latest $ACR_REGISTRY/$IMAGE_NAME:latest
          
          # Push
          echo "Pushing images to ACR..."
          docker push $ACR_REGISTRY/$IMAGE_NAME:${{ github.sha }}
          docker push $ACR_REGISTRY/$IMAGE_NAME:latest
          
      - name: Push success
        run: |
          echo "✅ Images pushed successfully!"
          echo "📦 ${{ secrets.ACR_REGISTRY_NAME }}.azurecr.io/softbank-mentari:${{ github.sha }}"
          echo "📦 ${{ secrets.ACR_REGISTRY_NAME }}.azurecr.io/softbank-mentari:latest"
