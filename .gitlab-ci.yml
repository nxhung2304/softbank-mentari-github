stages:
  - build
  - push

variables:
  IMAGE_NAME: softbank-mentari
  ACR_REGISTRY: ${ACR_REGISTRY_NAME}.azurecr.io
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: "/certs"

build_docker_image:
  stage: build
  image: docker:24
  services:
    - docker:24-dind
  before_script:
    - docker info
  script:
    - echo "Building Docker image..."
    - docker build -t $IMAGE_NAME:develop .
    - echo "Saving Docker image..."
    - docker save $IMAGE_NAME:develop -o image.tar
    - ls -lh *.tar
  artifacts:
    paths:
      - image.tar
    expire_in: 1 hour
  only:
    - develop

push_to_acr:
  stage: push
  image: docker:24
  services:
    - docker:24-dind
  before_script:
    - ls -lh
    - echo "Loading Docker image..."
    - docker load -i image.tar
    - docker images
    - echo "Logging into ACR..."
    - echo $ACR_PASSWORD | docker login $ACR_REGISTRY -u $ACR_USERNAME --password-stdin
  script:
    - echo "Tagging image..."
    - docker tag $IMAGE_NAME:develop $ACR_REGISTRY/$IMAGE_NAME:develop
    
    - echo "Pushing to ACR..."
    - docker push $ACR_REGISTRY/$IMAGE_NAME:develop
    
    - echo "Image pushed successfully!"
    - echo "Saved at: $ACR_REGISTRY/$IMAGE_NAME:develop"
  dependencies:
    - build_docker_image
  only:
    - develop
